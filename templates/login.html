{% extends 'base.html' %}
{% block title %}{{ t.page_login }}{% endblock %}

{% block content %}
<div class="login-page">
  <div class="login-card">

    <!-- Language switcher -->
    <div class="lang-switcher lang-switcher-login">
      <a href="{{ url_for('lang.set_language', code='en') }}"
         class="lang-btn{% if current_lang == 'en' %} active{% endif %}">🇬🇧 EN</a>
      <a href="{{ url_for('lang.set_language', code='de') }}"
         class="lang-btn{% if current_lang == 'de' %} active{% endif %}">🇩🇪 DE</a>
      <a href="{{ url_for('lang.set_language', code='tr') }}"
         class="lang-btn{% if current_lang == 'tr' %} active{% endif %}">🇹🇷 TR</a>
    </div>

    <div class="login-logo">
      <img src="{{ url_for('static', filename='logo.png') }}" class="logo-img-login" alt="Späti 4 You" />
      <p>{{ t.login_subtitle }}</p>
    </div>

    <form method="POST" action="{{ url_for('auth.login') }}">
      <div class="form-group">
        <label for="username">{{ t.username }}</label>
        <input
          type="text"
          id="username"
          name="username"
          placeholder="{{ t.username_placeholder }}"
          autocomplete="username"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">{{ t.password }}</label>
        <div class="pw-wrap">
          <input
            type="password"
            id="password"
            name="password"
            placeholder="{{ t.password_placeholder }}"
            autocomplete="current-password"
            required
          />
          <button type="button" class="pw-toggle" id="pw-toggle-btn" aria-label="Show password" tabindex="-1">
            <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg id="eye-off-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-primary">{{ t.login_btn }}</button>
    </form>

  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  document.getElementById("pw-toggle-btn").addEventListener("click", function () {
    var inp    = document.getElementById("password");
    var eyeOn  = document.getElementById("eye-icon");
    var eyeOff = document.getElementById("eye-off-icon");
    var show   = inp.type === "password";
    inp.type             = show ? "text"   : "password";
    eyeOn.style.display  = show ? "none"   : "";
    eyeOff.style.display = show ? ""       : "none";
  });
</script>
{% endblock %}
