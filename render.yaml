services:
  - type: web
    name: spati-scheduler
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: spati-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: spati-db
    plan: free
